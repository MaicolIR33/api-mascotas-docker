version: "3.9"

services:
  db:
    image: mysql:8.4
    container_name: vet_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: veterinaria
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - red_interna

  api:
    build: ./api
    container_name: vet_api
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: veterinaria
    depends_on:
      - db
    networks:
      - red_interna

  nginx:
    image: nginx:1.27-alpine
    container_name: vet_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - red_interna

networks:
  red_interna:
    driver: bridge

volumes:
  db_data:
